name: godex-ai-agent
base: core22
version: $SNAPCRAFT_PROJECT_VERSION
icon: gui/godex-ai-agent.png
summary: Lightweight AI agent with TUI for Ollama, llama.cpp, OpenRouter and more
description: |
  Godex is a lightweight AI agent with an interactive TUI that interfaces
  with Ollama, llama.cpp,, OpenRouter and other LLM providers.
  
  Features:
  - Chat history with persistent conversation context
  - Parallel agent execution with fully isolated context per agent
  - Efficient token usage with intelligent context management
  - Automatically downloads and bootstraps llama.cpp for local inference
  - Built-in MCP server support for tool integration
  - Clean TUI for seamless interaction across multiple providers

  ## Troubleshooting

  - Clicking on `open` in the App Store will not start the agent. Search for `Godex` in your applications folder (pressing win key to open on wayland)  

grade: stable
confinement: strict

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64]
    build-for: [arm64]

parts:
  godex:
    plugin: dump
    source: https://github.com/anomalyco/godex/releases/download/v$SNAPCRAFT_PROJECT_VERSION/godex-linux-amd64.tar.gz
    source-type: tar
    organize:
      godex: bin/godex
  launcher:
    plugin: nil
    source: .
    build-packages:
      - gcc
      - pkg-config
      - libgtk-3-dev
      - libvte-2.91-dev
    stage-packages:
      - libgtk-3-0
      - libvte-2.91-0
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin" "$CRAFT_PART_INSTALL/gui"
      gcc -O2 -o "$CRAFT_PART_INSTALL/bin/godex-gui" \
        "$CRAFT_PART_SRC/bin/godex-gui.c" \
        $(pkg-config --cflags --libs gtk+-3.0 vte-2.91)
      cp -a "$CRAFT_PART_SRC/bin/godex-launch" "$CRAFT_PART_INSTALL/bin/godex-launch"
      cp -a "$CRAFT_PART_SRC/gui/godex-ai-agent.png" "$CRAFT_PART_INSTALL/gui/godex-ai-agent.png"
      cp -a "$CRAFT_PART_SRC/gui/godex.desktop" "$CRAFT_PART_INSTALL/gui/godex.desktop"
    stage:
      - bin/godex-gui
      - bin/godex-launch
      - gui/godex-ai-agent.png
      - gui/godex.desktop
    prime:
      - bin/godex-gui
      - bin/godex-launch
      - gui/godex-ai-agent.png
      - gui/godex.desktop

apps:
  godex:
    command: bin/godex-gui
    desktop: gui/godex.desktop
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - x11
      - wayland
  godex-cli:
    command: bin/godex
    plugs:
      - home
      - network
  godex-terminal:
    command: bin/godex
    command-chain:
      - bin/godex-launch
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - x11
      - wayland
