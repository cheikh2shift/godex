name: godex-ai-agent
base: core22
version: $SNAPCRAFT_PROJECT_VERSION
icon: gui/godex-ai-agent.png
summary: Lightweight AI agent with TUI for Ollama, llama.cpp, OpenRouter and more
description: |
  Godex is a lightweight AI agent with an interactive TUI that interfaces
  with Ollama, llama.cpp,, OpenRouter and other LLM providers.
  
  Features:
  - Chat history with persistent conversation context
  - Parallel agent execution with fully isolated context per agent
  - Efficient token usage with intelligent context management
  - Automatically downloads and bootstraps llama.cpp for local inference
  - Built-in MCP server support for tool integration
  - Clean TUI for seamless interaction across multiple providers

grade: stable
confinement: strict

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64]
    build-for: [arm64]

parts:
  godex:
    plugin: dump
    source: https://github.com/anomalyco/godex/releases/download/v$SNAPCRAFT_PROJECT_VERSION/godex-linux-amd64.tar.gz
    source-type: tar
    organize:
      godex: bin/godex
  launcher:
    plugin: dump
    source: .
    organize:
      bin/godex-launch: bin/godex-launch
      gui/godex-ai-agent.png: gui/godex-ai-agent.png
      gui/godex.desktop: gui/godex.desktop
    prime:
      - bin/godex-launch
      - gui/godex-ai-agent.png
      - gui/godex.desktop

apps:
  godex:
    command: bin/godex
    plugs:
      - home
      - network
  godex-terminal:
    command: bin/godex-launch
    desktop: gui/godex.desktop
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - x11
      - wayland
