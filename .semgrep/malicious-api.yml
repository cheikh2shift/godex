rules:
- id: go-exec-command-with-variable
  languages: [go]
  message: "Dynamic command execution: review use of variable input in os/exec."
  severity: WARNING
  patterns:
  - pattern: exec.Command($CMD, ...).Run()
  - metavariable-pattern:
      metavariable: $CMD
      pattern: $X
  metadata:
    category: security
    confidence: medium
    likelihood: medium
    impact: high

- id: go-exec-commandcontext-with-variable
  languages: [go]
  message: "Dynamic command execution: review use of variable input in os/exec."
  severity: WARNING
  patterns:
  - pattern: exec.CommandContext($CTX, $CMD, ...).Run()
  - metavariable-pattern:
      metavariable: $CMD
      pattern: $X
  metadata:
    category: security
    confidence: medium
    likelihood: medium
    impact: high

- id: go-http-get-variable-url
  languages: [go]
  message: "External HTTP call with variable URL: ensure destination is trusted/validated."
  severity: INFO
  patterns:
  - pattern: http.Get($URL)
  - metavariable-pattern:
      metavariable: $URL
      pattern: $X
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: medium

- id: go-http-post-variable-url
  languages: [go]
  message: "External HTTP call with variable URL: ensure destination is trusted/validated."
  severity: INFO
  patterns:
  - pattern: http.Post($URL, ..., ...)
  - metavariable-pattern:
      metavariable: $URL
      pattern: $X
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: medium

- id: go-http-newrequest-variable-url
  languages: [go]
  message: "External HTTP call with variable URL: ensure destination is trusted/validated."
  severity: INFO
  patterns:
  - pattern: http.NewRequest($METHOD, $URL, ...)
  - metavariable-pattern:
      metavariable: $URL
      pattern: $X
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: medium

- id: go-http-newrequestcontext-variable-url
  languages: [go]
  message: "External HTTP call with variable URL: ensure destination is trusted/validated."
  severity: INFO
  patterns:
  - pattern: http.NewRequestWithContext($CTX, $METHOD, $URL, ...)
  - metavariable-pattern:
      metavariable: $URL
      pattern: $X
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: medium

- id: go-grpc-dial-variable-target
  languages: [go]
  message: "External gRPC connection with variable target: ensure destination is trusted/validated."
  severity: INFO
  patterns:
  - pattern: grpc.Dial($TARGET, ...)
  - metavariable-pattern:
      metavariable: $TARGET
      pattern: $X
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: medium

- id: go-http-literal-url-not-allowlisted
  languages: [go]
  message: "External HTTP call to non-allowlisted URL literal. If intentional, add to allowlist."
  severity: WARNING
  paths:
    include:
    - internal/providers/
    - modelquery/
    exclude:
    - "**/*_test.go"
  patterns:
  - pattern-either:
    - pattern: http.Get($URL)
    - pattern: http.Post($URL, ..., ...)
    - pattern: http.NewRequest($METHOD, $URL, ...)
    - pattern: http.NewRequestWithContext($CTX, $METHOD, $URL, ...)
  - metavariable-regex:
      metavariable: $URL
      regex: "\"https?://(?!localhost(?::\\d+)?/|127\\.0\\.0\\.1(?::\\d+)?/|openrouter\\.ai/|router\\.huggingface\\.co/|huggingface\\.co/|ollama\\.com/|generativelanguage\\.googleapis\\.com/|api\\.github\\.com/|github\\.com/)[^\"]+\""
  metadata:
    category: security
    confidence: medium
    likelihood: medium
    impact: medium

- id: go-exec-shell-interpreter
  languages: [go]
  message: "Shell interpreter execution (bash/sh/cmd/powershell). Review for abuse of command interpreters."
  severity: WARNING
  pattern-either:
  - pattern: exec.Command("sh", "-c", ...)
  - pattern: exec.Command("bash", "-c", ...)
  - pattern: exec.Command("cmd", "/c", ...)
  - pattern: exec.Command("powershell", ...)
  - pattern: exec.Command("pwsh", ...)
  metadata:
    category: security
    confidence: medium
    likelihood: medium
    impact: high

- id: go-exec-shell-download
  languages: [go]
  message: "Shell command includes common download utilities (curl/wget/etc). Review for ingress tool transfer."
  severity: WARNING
  patterns:
  - pattern: exec.Command($SHELL, $FLAG, $CMD)
  - metavariable-regex:
      metavariable: $SHELL
      regex: "\"(sh|bash|cmd|powershell|pwsh)\""
  - metavariable-regex:
      metavariable: $FLAG
      regex: "\"(-c|/c)\""
  - metavariable-regex:
      metavariable: $CMD
      regex: "\".*(curl|wget|Invoke-WebRequest|iwr|certutil|bitsadmin).*\""
  metadata:
    category: security
    confidence: medium
    likelihood: medium
    impact: high

- id: go-write-then-exec
  languages: [go]
  message: "Writes a file and executes it in the same function. Review for dropper behavior."
  severity: WARNING
  patterns:
  - pattern-inside: |
      func $F(...) {
        ...
      }
  - pattern-either:
    - pattern: os.WriteFile($PATH, ..., ...)
    - pattern: ioutil.WriteFile($PATH, ..., ...)
  - pattern: exec.Command($PATH, ...)
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: high

- id: go-base64-decode-then-exec
  languages: [go]
  message: "Base64 decode combined with command execution in the same function. Review for encoded payload execution."
  severity: WARNING
  patterns:
  - pattern-inside: |
      func $F(...) {
        ...
      }
  - pattern-either:
    - pattern: base64.StdEncoding.DecodeString(...)
    - pattern: base64.URLEncoding.DecodeString(...)
    - pattern: base64.RawStdEncoding.DecodeString(...)
    - pattern: base64.RawURLEncoding.DecodeString(...)
  - pattern-either:
    - pattern: exec.Command("sh", "-c", ...)
    - pattern: exec.Command("bash", "-c", ...)
    - pattern: exec.Command("cmd", "/c", ...)
    - pattern: exec.Command("powershell", ...)
    - pattern: exec.Command("pwsh", ...)
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: high

- id: go-suspicious-persistence-path
  languages: [go]
  message: "Writes to common persistence locations (cron/systemd/LaunchAgents/Startup). Review for persistence."
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: os.WriteFile($PATH, ..., ...)
    - pattern: ioutil.WriteFile($PATH, ..., ...)
    - pattern: os.Create($PATH)
  - metavariable-regex:
      metavariable: $PATH
      regex: "\"(/etc/cron|/etc/systemd/system|/etc/init\\.d|/Library/LaunchAgents|/Library/LaunchDaemons|/Users/[^/]+/Library/LaunchAgents|/Users/[^/]+/Library/LaunchDaemons|/home/[^/]+/\\.config/systemd/user|/home/[^/]+/\\.config/autostart|C:\\\\\\\\Users\\\\\\\\[^\\\\\\\\]+\\\\\\\\AppData\\\\\\\\Roaming\\\\\\\\Microsoft\\\\\\\\Windows\\\\\\\\Start Menu\\\\\\\\Programs\\\\\\\\Startup).*\""
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: high

- id: go-suspicious-cron-install
  languages: [go]
  message: "Uses cron/systemctl/launchctl to install persistence. Review for malicious persistence."
  severity: WARNING
  pattern-either:
  - pattern: exec.Command("crontab", ...)
  - pattern: exec.Command("systemctl", "enable", ...)
  - pattern: exec.Command("systemctl", "start", ...)
  - pattern: exec.Command("launchctl", "load", ...)
  - pattern: exec.Command("launchctl", "bootstrap", ...)
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: high

- id: go-registry-run-key
  languages: [go]
  message: "Modifies Windows Run/RunOnce registry keys. Review for persistence."
  severity: WARNING
  patterns:
  - pattern-inside: |
      func $F(...) {
        ...
      }
  - pattern: registry.OpenKey(..., $PATH, ...)
  - metavariable-regex:
      metavariable: $PATH
      regex: ".*Run(Once)?"
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: high

- id: go-netcat-like-shell
  languages: [go]
  message: "Spawns shell and attaches to network connection. Review for reverse shell behavior."
  severity: WARNING
  patterns:
  - pattern-inside: |
      func $F(...) {
        ...
      }
  - pattern: net.Dial(...)
  - pattern-either:
    - pattern: exec.Command("sh", "-c", ...)
    - pattern: exec.Command("bash", "-c", ...)
    - pattern: exec.Command("cmd", "/c", ...)
    - pattern: exec.Command("powershell", ...)
  metadata:
    category: security
    confidence: low
    likelihood: medium
    impact: high
