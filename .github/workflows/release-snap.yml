name: Release to Snap Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  SNAP_CHANNEL: stable

jobs:
  build-and-publish-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version
        id: get_tag
        run: |
          TAG="${{ inputs.version }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
          TAG: ${{ steps.get_tag.outputs.TAG }}
          VERSION: ${{ steps.get_tag.outputs.VERSION }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +"%Y-%m-%d_%H:%M:%S")" -o dist/godex ./cmd/godex

      - name: Create tarball for snap
        env:
          VERSION: ${{ steps.get_tag.outputs.VERSION }}
        run: |
          mkdir -p snap-build/godex-${VERSION}-linux-amd64
          cp dist/godex snap-build/godex-${VERSION}-linux-amd64/godex
          chmod +x snap-build/godex-${VERSION}-linux-amd64/godex
          tar -czf godex-${VERSION}-linux-amd64.tar.gz -C snap-build godex-${VERSION}-linux-amd64

      - name: Copy assets for snap
        run: |
          cp packaging/snap/gui/godex-ai-agent.png packaging/snap/
          cp screen3.gif packaging/snap/
          cp screen2.gif packaging/snap/
          cp scrreen.gif packaging/snap/

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Ensure snapd and core22
        run: |
          sudo systemctl start snapd
          sudo snap wait system seed.loaded
          sudo snap install core22 --channel=latest/stable

      - name: Configure Snapcraft credentials
        env:
          SNAP_CREDENTIALS: ${{ secrets.SNAP_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/snapcraft
          echo "$SNAP_CREDENTIALS" > ~/.config/snapcraft/snapcraft.cfg

      - name: Build Snap
        env:
          VERSION: ${{ steps.get_tag.outputs.VERSION }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        working-directory: packaging/snap
        run: |
          tarball="$GITHUB_WORKSPACE/godex-${VERSION}-linux-amd64.tar.gz"
          if [ ! -f "$tarball" ]; then
            echo "Missing tarball: $tarball"
            exit 1
          fi
          sed -i "s|^\\(\\s*\\)source: .*|\\1source: ${tarball}|" snapcraft.yaml
          sed -i "s/\$SNAPCRAFT_PROJECT_VERSION/${VERSION}/g" snapcraft.yaml
          snapcraft pack --destructive-mode --output "$GITHUB_WORKSPACE/godex_${VERSION}_amd64.snap"
      
      - name: Dump Snapcraft logs on failure
        if: failure()
        run: |
          echo "=== Snapcraft logs ==="
          log_dir="$HOME/.local/state/snapcraft/log"
          if [ -d "$log_dir" ]; then
            ls -1t "$log_dir" | head -5
            latest_log=$(ls -1t "$log_dir" | head -1)
            if [ -n "$latest_log" ]; then
              echo "--- $log_dir/$latest_log ---"
              cat "$log_dir/$latest_log"
            fi
          else
            echo "No snapcraft log directory found at $log_dir"
          fi

      - name: Upload Snap to Store
        env:
          VERSION: ${{ steps.get_tag.outputs.VERSION }}
        run: |
          snap_name=$(ls *.snap 2>/dev/null | head -1)
          if [ -n "$snap_name" ]; then
            echo "Uploading $snap_name to Snap Store..."
            snapcraft upload "$snap_name" --release "${SNAP_CHANNEL}"
          else
            echo "No snap file found"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          TAG: ${{ steps.get_tag.outputs.TAG }}
          VERSION: ${{ steps.get_tag.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          snap_file=$(ls *.snap | head -1)
          tar_file=$(ls *.tar.gz | head -1)
          
          # Generate checksums
          echo "$snap_file" | xargs sha256sum > SHA256SUMS
          echo "$tar_file" | xargs sha256sum >> SHA256SUMS
          
          gh release create "$TAG" \
            --title "Release $TAG" \
            --draft \
            --notes "See https://github.com/anomalyco/godex/releases" \
            "$snap_file" "$tar_file" SHA256SUMS
