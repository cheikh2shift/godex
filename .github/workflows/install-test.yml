name: Install Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Download and run install.sh
        run: curl -sSL https://raw.githubusercontent.com/cheikh2shift/godex/main/install.sh | sh
      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godex --version
      - name: Create dummy providers.yaml
        run: |
          printf -- 'providers:\n  - name: my-local-identifier\n    type: ollama\n    api_key: dummy\ndefault_provider: my-local-identifier\nvision_enabled: true\nvision_cli_downloaded: true\n' > providers.yaml
      - name: Test UI rendering
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- VERSION ---"
          godex --version
          (godex --config providers.yaml --provider my-local-identifier --model llama3 > output.txt 2>&1 &)
          sleep 3
          pkill -f "godex" || true
          echo "--- OUTPUT ---"
          cat output.txt

  install-macos-amd64:
    runs-on: macos-15-intel
    steps:
      - name: Download and run install.sh
        run: curl -sSL https://raw.githubusercontent.com/cheikh2shift/godex/main/install.sh | sh
      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godex --version
      - name: Create dummy providers.yaml
        run: |
          printf -- 'providers:\n  - name: my-local-identifier\n    type: ollama\n    api_key: dummy\ndefault_provider: my-local-identifier\nvision_enabled: true\nvision_cli_downloaded: true\n' > providers.yaml
      - name: Test UI rendering
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- VERSION ---"
          godex --version
          (godex --config providers.yaml --provider my-local-identifier --model llama3 > output.txt 2>&1 &)
          sleep 3
          pkill -f "godex" || true
          echo "--- OUTPUT ---"
          cat output.txt

  install-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Download and run install.sh
        run: curl -sSL https://raw.githubusercontent.com/cheikh2shift/godex/main/install.sh | sh
      - name: Create dummy providers.yaml
        run: |
          printf -- 'providers:\n  - name: my-local-identifier\n    type: ollama\n    api_key: dummy\ndefault_provider: my-local-identifier\nvision_enabled: true\nvision_cli_downloaded: true\n' > providers.yaml
      - name: Test UI rendering
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- VERSION ---"
          godex --version
          (godex --config providers.yaml --provider my-local-identifier --model llama3 > output.txt 2>&1 &)
          sleep 3
          pkill -f "godex" || true
          echo "--- OUTPUT ---"
          cat output.txt

  install-windows:
    runs-on: windows-latest
    steps:
      - name: Download Windows binary
        run: |
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/cheikh2shift/godex/releases/latest"
          $version = ($response.tag_name) -replace '^v',''
          Write-Host "Downloading version v$version"
          curl.exe -sSL -o godex-windows-amd64.exe "https://github.com/cheikh2shift/godex/releases/download/v${version}/godex-windows-amd64.exe"
        shell: pwsh

      - name: Verify installation
        run: |
          $header = [System.IO.File]::ReadAllBytes("godex-windows-amd64.exe")[0..1]
          if ($header[0] -eq 77 -and $header[1] -eq 90) {
            Write-Host "Valid PE executable"
            ./godex-windows-amd64.exe --version
          } else {
            Write-Host "Invalid file - first bytes: $($header[0]) $($header[1])"
          }
        shell: pwsh

      - name: Create dummy providers.yaml
        run: |
          "providers:`n  - name: my-local-identifier`n    type: ollama`n    api_key: dummy`ndefault_provider: my-local-identifier`nvision_enabled: true`nvision_cli_downloaded: true" | Out-File -FilePath providers.yaml -Encoding utf8
        shell: pwsh

      - name: Test UI rendering
        run: |
          Write-Host "--- VERSION ---"
          ./godex-windows-amd64.exe --version
          $job = Start-Job -ScriptBlock { ./godex-windows-amd64.exe --config providers.yaml --provider my-local-identifier --model llama3 } 
          Start-Sleep -Seconds 3
          Stop-Job -Job $job -ErrorAction SilentlyContinue
          Receive-Job -Job $job | Out-File -FilePath output.txt
          Write-Host "--- OUTPUT ---"
          Get-Content output.txt
        shell: pwsh