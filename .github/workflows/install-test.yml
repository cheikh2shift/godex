name: Install Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Download and run install.sh
        run: curl -sSL https://raw.githubusercontent.com/cheikh2shift/godex/main/install.sh | sh
      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godex --version

  install-macos-amd64:
    runs-on: macos-15-intel
    steps:
      - name: Download and run install.sh
        run: curl -sSL https://raw.githubusercontent.com/cheikh2shift/godex/main/install.sh | sh
      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godex --version

  install-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Download and run install.sh
        run: curl -sSL https://raw.githubusercontent.com/cheikh2shift/godex/main/install.sh | sh
      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godex --version

  install-windows:
    runs-on: windows-latest
    steps:
      - name: Get latest release tag
        id: get_tag
        run: |
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/cheikh2shift/godex/releases/latest"
          echo "TAG=$($response.tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Download Windows binary
        run: |
          Write-Host "Tag: ${{ steps.get_tag.outputs.TAG }}"
          curl.exe -sSL -o godex-windows-amd64.exe "https://github.com/cheikh2shift/godex/releases/download/${{ steps.get_tag.outputs.TAG }}/godex-windows-amd64.exe"
          Get-Item godex-windows-amd64.exe | Select-Object Name, Length
        shell: pwsh

      - name: Verify installation
        run: |
          $bytes = Get-Content godex-windows-amd64.exe -TotalCount 2 -Encoding Byte
          if ($bytes[0] -eq 77 -and $bytes[1] -eq 90) {
            Write-Host "Valid PE executable"
            ./godex-windows-amd64.exe --version
          } else {
            Write-Host "Invalid file - first bytes: $($bytes[0]) $($bytes[1])"
            Get-Content godex-windows-amd64.exe -TotalCount 5
          }
        shell: pwsh