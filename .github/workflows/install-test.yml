name: Install Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Download and run install.sh
        run: curl -sSL https://raw.githubusercontent.com/cheikh2shift/godex/main/install.sh | sh
      - name: Create .env from GitHub secret
        run: |
          printf 'OPENROUTER_API_KEY=%s\n' "${{ secrets.OPENROUTER_API_KEY }}" > .env
          set -a
          . ./.env
          set +a
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY secret is required"
            exit 1
          fi
          echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> "$GITHUB_ENV"
      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godex --version
      - name: Create OpenRouter providers.yaml
        run: |
          printf -- 'providers:\n  - name: openrouter-ci\n    type: openrouter\n    endpoint: https://openrouter.ai/api/v1\n    model: minimax/minimax-m2.5\n    api_key_env: OPENROUTER_API_KEY\n    max_tool_rounds: 2\n    mcp_servers:\n      - name: filesystem\n        allowed_paths:\n          - .\ndefault_provider: openrouter-ci\nvision_enabled: false\nvision_cli_downloaded: true\n' > providers.yaml
      - name: Run prompt before TUI test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godex --config providers.yaml --debug --provider openrouter-ci --prompt "What are the files in this directory" --auto-confirm
      - name: Test binary execution
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- VERSION ---"
          godex --version
          script -c "godex --config providers.yaml --provider openrouter-ci" output.txt > output.txt 2>&1 &
          sleep 3
          pkill -f "godex" || true
          echo "--- OUTPUT ---"
          cat output.txt

