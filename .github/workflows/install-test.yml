  install-windows:
    runs-on: windows-latest
    steps:
      - name: Download Windows binary
        run: |
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/cheikh2shift/godex/releases/latest"
          $version = ($response.tag_name) -replace '^v',''
          Write-Host "Downloading version v$version"
          curl.exe -sSL -o godex-windows-amd64.exe "https://github.com/cheikh2shift/godex/releases/download/v${version}/godex-windows-amd64.exe"
        shell: pwsh

      - name: Verify installation
        run: |
          $header = [System.IO.File]::ReadAllBytes("godex-windows-amd64.exe")[0..1]
          if ($header[0] -eq 77 -and $header[1] -eq 90) {
            Write-Host "Valid PE executable"
            ./godex-windows-amd64.exe --version
          } else {
            Write-Host "Invalid file - first bytes: $($header[0]) $($header[1])"
          }
        shell: pwsh

      - name: Create .env from GitHub secret
        run: |
          "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" | Out-File -FilePath .env -Encoding ascii
          $line = Get-Content .env -Raw
          $key = (($line -replace '^OPENROUTER_API_KEY=', '')).Trim()
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "OPENROUTER_API_KEY secret is required"
          }
          "OPENROUTER_API_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Create OpenRouter providers.yaml
        run: |
          "providers:`n  - name: openrouter-ci`n    type: openrouter`n    endpoint: https://openrouter.ai/api/v1`n    model: minimax/minimax-m2.5`n    api_key_env: OPENROUTER_API_KEY`n    max_tool_rounds: 2`n    mcp_servers:`n      - name: filesystem`n        allowed_paths:`n          - .`ndefault_provider: openrouter-ci`nvision_enabled: false`nvision_cli_downloaded: false" | Out-File -FilePath providers.yaml -Encoding utf8
        shell: pwsh

      - name: Run prompt before TUI test
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          ./godex-windows-amd64.exe --debug --config providers.yaml --provider openrouter-ci --prompt "What are the files in this directory" --auto-confirm
        shell: pwsh

      - name: Test binary execution
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "--- VERSION ---"
          ./godex-windows-amd64.exe --version
          $job = Start-Job -ScriptBlock { 
            [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
            $OutputEncoding = [System.Text.Encoding]::UTF8
            $pinfo = New-Object System.Diagnostics.ProcessStartInfo
            $pinfo.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            $pinfo.StandardErrorEncoding = [System.Text.Encoding]::UTF8
            $pinfo.FileName = ".\godex-windows-amd64.exe"
            $pinfo.Arguments = "--config providers.yaml --provider openrouter-ci"
            $pinfo.UseShellExecute = $false
            $pinfo.RedirectStandardOutput = $true
            $pinfo.RedirectStandardError = $true
            $pinfo.CreateNoWindow = $true
            $p = New-Object System.Diagnostics.Process
            $p.StartInfo = $pinfo
            $p.Start() | Out-Null
            Start-Sleep -Seconds 3
            if (-not $p.HasExited) { $p.Kill() }
            $stdout = $p.StandardOutput.ReadToEnd()
            $stderr = $p.StandardError.ReadToEnd()
            "$stdout`n$stderr"
          }
          Start-Sleep -Seconds 4
          $output = Receive-Job -Job $job
          $output | Out-File -FilePath output.txt
          Write-Host "--- OUTPUT ---"
          $output
        shell: pwsh
