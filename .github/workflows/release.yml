name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version
        id: get_tag
        run: echo "TAG=${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${TAG#v} -X main.buildTime=$(date -u +"%Y-%m-%d_%H:%M:%S")" -o dist/godex-${TAG#v}-linux-amd64 ./cmd/godex

      - name: Build Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          go build -ldflags="-s -w -X main.version=${TAG#v} -X main.buildTime=$(date -u +"%Y-%m-%d_%H:%M:%S")" -o dist/godex-${TAG#v}-linux-arm64 ./cmd/godex

      - name: Build macOS AMD64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          go build -ldflags="-s -w -X main.version=${TAG#v} -X main.buildTime=$(date -u +"%Y-%m-%d_%H:%M:%S")" -o dist/godex-${TAG#v}-darwin-amd64 ./cmd/godex

      - name: Build macOS ARM64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          go build -ldflags="-s -w -X main.version=${TAG#v} -X main.buildTime=$(date -u +"%Y-%m-%d_%H:%M:%S")" -o dist/godex-${TAG#v}-darwin-arm64 ./cmd/godex

      - name: Build Windows AMD64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          go build -ldflags="-s -w -X main.version=${TAG#v} -X main.buildTime=$(date -u +"%Y-%m-%d_%H:%M:%S")" -o dist/godex-${TAG#v}-windows-amd64.exe ./cmd/godex

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ steps.get_tag.outputs.tag }}
          path: dist/*

  build-tarball:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ needs.build-binaries.outputs.tag }}
          path: dist

      - name: Create tarballs
        run: |
          VERSION=${{ needs.build-binaries.outputs.tag#v }}
          
          for arch in amd64 arm64; do
            case $arch in
              amd64) tar_arch="x86_64" ;;
              arm64) tar_arch="aarch64" ;;
            esac
            
            mkdir -p godex-${VERSION}-linux-${tar_arch}
            cp dist/godex-${VERSION}-linux-${arch} godex-${VERSION}-linux-${tar_arch}/godex
            chmod 755 godex-${VERSION}-linux-${tar_arch}/godex
            
            tar -czf godex-${VERSION}-linux-${tar_arch}.tar.gz godex-${VERSION}-linux-${tar_arch}
            rm -rf godex-${VERSION}-linux-${tar_arch}
          done

          # macOS
          for arch in amd64 arm64; do
            mkdir -p godex-${VERSION}-darwin-${arch}
            cp dist/godex-${VERSION}-darwin-${arch} godex-${VERSION}-darwin-${arch}/godex
            chmod 755 godex-${VERSION}-darwin-${arch}/godex
            tar -czf godex-${VERSION}-darwin-${arch}.tar.gz godex-${VERSION}-darwin-${arch}
            rm -rf godex-${VERSION}-darwin-${arch}
          done

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: tarballs-${{ needs.build-binaries.outputs.tag }}
          path: "*.tar.gz"

  create-release:
    runs-on: ubuntu-latest
    needs: [build-binaries, build-tarball]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect all files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          
          # Generate checksums
          cd release
          sha256sum * > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-binaries.outputs.tag }}
          name: Release ${{ needs.build-binaries.outputs.tag }}
          draft: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
