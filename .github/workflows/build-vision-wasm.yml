name: Build Vision WASM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vision:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasi

      - name: Build vision.wasm
        working-directory: packaging/vision
        run: |
          cargo build --release --target wasm32-wasi
          cp target/wasm32-wasi/release/vision.wasm ../vision.wasm

      - name: Commit vision.wasm
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add packaging/vision/vision.wasm
          git add packaging/vision/README.md packaging/vision/Cargo.toml packaging/vision/src/main.rs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "build: update vision.wasm"
          git push
