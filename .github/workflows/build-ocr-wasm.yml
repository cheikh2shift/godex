name: Build OCR WASM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ocr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build ocr.wasm
        working-directory: packaging/ocr
        run: |
          cargo build --release --target wasm32-wasip1
          cp target/wasm32-wasip1/release/ocr.wasm ./ocr.wasm

      - name: Commit ocr.wasm
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add packaging/ocr/ocr.wasm
          git add packaging/ocr/README.md packaging/ocr/Cargo.toml packaging/ocr/src/main.rs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "build: update ocr.wasm"
          git push
