services:
  ollama-proxy:
    image: nginx:alpine
    container_name: ollama-proxy
    restart: unless-stopped
    ports:
      - "11435:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: "nginx -g 'daemon off;' >/dev/null 2>&1"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - godex-network
    depends_on:
      - godex
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "none"

  godex:
    build:
      context: .
    image: godex-sandbox:latest
    container_name: godex
    environment:
      - HOME=/godex-home
    volumes:
      - .:/workspace
      - godex-config:/godex-home/.godex
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - godex-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_BIND_SERVICE
    ulimits:
      nproc: 512
      nofile:
        soft: 256
        hard: 256

networks:
  godex-network:
    driver: bridge

volumes:
  godex-config:
